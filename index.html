<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maila's General Merchandise — V2</title>
<style>
:root{--blue:#4775E7;--blue2:#E5EBFC;--blue3:#F5F7FE;--ink:#454551;--muted:#737784;--line:#D8D9DC;--white:#fff;--danger:#D54773;--success:#2E9B65;--warn:#C88919;--shadow:0 10px 30px rgba(69,69,81,.09)}
*{box-sizing:border-box}body{margin:0;background:var(--blue3);font-family:Segoe UI,Aptos,Arial,sans-serif;color:var(--ink)}
button,input,select{font:inherit}.hidden{display:none!important}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#eef3ff,#fff)}
.login-card{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:32px;box-shadow:0 20px 60px rgba(69,69,81,.14);text-align:center}
.login-card img{width:90px;height:90px;object-fit:contain}.login-card h1{margin:12px 0 3px;font-size:23px}.login-card p{margin:0 0 25px;color:var(--muted);font-size:13px}
.field{display:flex;flex-direction:column;gap:6px;text-align:left;margin-bottom:13px}.field label{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.5px}.field input,.field select{padding:12px;border:1px solid var(--line);border-radius:11px;outline:0;background:#fff}.field input:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue2)}
.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:750;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{background:#fff;border:1px solid var(--line)}.danger{background:#fff0f4;color:var(--danger)}.wide{width:100%}
.login-hint{margin-top:15px;font-size:11px;color:var(--muted)}
.app{display:flex;min-height:100vh}.sidebar{width:245px;background:#fff;border-right:1px solid var(--line);position:fixed;left:0;top:0;bottom:0;padding:22px 14px;z-index:10}.side-brand{display:flex;align-items:center;gap:10px;padding:0 8px 25px}.side-brand img{width:44px;height:44px;object-fit:contain}.side-brand strong{font-size:14px;line-height:1.15}.nav{display:flex;flex-direction:column;gap:6px}.nav button{border:0;background:transparent;text-align:left;padding:12px;border-radius:11px;color:var(--ink);cursor:pointer;font-weight:650}.nav button.active,.nav button:hover{background:var(--blue2);color:var(--blue)}.userbox{position:absolute;bottom:18px;left:18px;right:18px;background:var(--blue3);padding:12px;border-radius:12px;font-size:12px}.userbox small{color:var(--muted)}
.main{margin-left:245px;width:calc(100% - 245px)}.topbar{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:8}.topbar h2{margin:0;font-size:20px}.topbar span{color:var(--muted);font-size:12px}.content{padding:25px 28px;max-width:1400px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:18px;box-shadow:var(--shadow)}.stat-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}.stat-value{font-size:28px;font-weight:800;margin-top:6px}.section{margin-top:18px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px}.section-head h3{margin:0;font-size:16px}.toolbar{display:flex;gap:9px;flex-wrap:wrap}.search{flex:1;min-width:230px}.search input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:#fff;outline:0}
.table-card{padding:0;overflow:hidden}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th{background:var(--blue2);font-size:11px;text-transform:uppercase;letter-spacing:.5px;text-align:left;padding:12px;white-space:nowrap}td{padding:11px 12px;border-top:1px solid #ececef;font-size:13px}tr:hover td{background:#fafbff}.badge{display:inline-flex;border-radius:99px;padding:5px 9px;font-size:11px;font-weight:800}.ok{background:#e9f8f0;color:var(--success)}.low{background:#fff7e5;color:var(--warn)}.out{background:#fff0f4;color:var(--danger)}.actions{display:flex;gap:6px}.icon{padding:7px 9px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer}.money{font-variant-numeric:tabular-nums}.alert{border-left:4px solid var(--warn);background:#fffaf0}.empty{text-align:center;color:var(--muted);padding:35px}
.grid2{display:grid;grid-template-columns:1.4fr .9fr;gap:18px}.summary-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eee}.summary-row.total{font-size:19px;font-weight:800;border-bottom:0}.receipt{max-width:480px;margin:auto;background:#fff;padding:26px;border:1px dashed #bbb;font-family:Arial,sans-serif}.receipt h1{text-align:center;font-size:20px;margin:0}.receipt .center{text-align:center;color:#666;font-size:12px}.receipt table{min-width:0}.receipt th,.receipt td{background:none;padding:7px 2px}.receipt th{font-size:10px;border-bottom:1px solid #bbb}.receipt td{font-size:12px}.modal-backdrop{position:fixed;inset:0;background:rgba(25,28,40,.45);display:none;align-items:center;justify-content:center;padding:18px;z-index:30}.modal-backdrop.show{display:flex}.modal{width:min(600px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:20px;padding:22px;box-shadow:0 25px 80px rgba(0,0,0,.25)}.modal h2{margin:0 0 16px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.full{grid-column:1/-1}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.mobile-menu{display:none}
@media(max-width:900px){.sidebar{transform:translateX(-100%);transition:.2s}.sidebar.open{transform:none}.main{margin-left:0;width:100%}.mobile-menu{display:block}.stats{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.content{padding:18px}}
@media(max-width:520px){.stats{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.topbar{padding:0 15px}}
@media print{body{background:#fff}.sidebar,.topbar,.no-print{display:none!important}.main{margin:0;width:100%}.content{padding:0}.receipt{border:0;max-width:none}}
</style>
</head>
<body>

<section id="login" class="login">
  <div class="login-card">
    <img id="loginLogo"><h1>Maila's General Merchandise</h1><p>Inventory & Sales Management System</p>
    <form id="loginForm">
      <div class="field"><label>USERNAME</label><input id="username" required autocomplete="username" value="admin"></div>
      <div class="field"><label>PASSWORD</label><input id="password" type="password" required autocomplete="current-password" placeholder="Enter password"></div>
      <button class="btn primary wide">Sign In</button>
    </form>
    <div class="login-hint">Demo account: <b>admin</b> / <b>admin123</b><br>Change credentials before deploying for real business use.</div>
  </div>
</section>

<section id="app" class="app hidden">
<aside id="sidebar" class="sidebar">
  <div class="side-brand"><img id="sideLogo"><strong>Maila's General<br>Merchandise</strong></div>
  <nav class="nav">
    <button data-page="dashboard" class="active">▦ &nbsp; Dashboard</button>
    <button data-page="inventory">▤ &nbsp; Inventory</button>
    <button data-page="sales">₱ &nbsp; Sales / Transactions</button>
    <button data-page="receipt">▥ &nbsp; Receipt</button>
  </nav>
  <div class="userbox">Signed in as <b id="who">admin</b><br><small>Administrator</small><br><button class="btn secondary" style="margin-top:8px;width:100%;padding:7px" onclick="logout()">Sign out</button></div>
</aside>

<main class="main">
  <header class="topbar"><div><button class="btn secondary mobile-menu" onclick="toggleSide()">☰</button> <h2 id="pageTitle" style="display:inline-block">Dashboard</h2></div><span id="dateNow"></span></header>
  <div id="content" class="content"></div>
</main>
</section>

<div id="modal" class="modal-backdrop"><div class="modal"><h2 id="modalTitle">Add Item</h2><form id="itemForm">
  <div class="form-grid">
    <div class="field full"><label>ITEM NAME</label><input id="fName" required></div>
    <div class="field"><label>SKU</label><input id="fSku" required></div>
    <div class="field"><label>SELLING PRICE / SRP (₱)</label><input id="fPrice" type="number" min="0" step=".01" required></div>
    <div class="field"><label>QUANTITY</label><input id="fQty" type="number" min="0" step="1" required></div>
    <div class="field"><label>LOW-STOCK LEVEL</label><input id="fReorder" type="number" min="0" step="1" value="5"></div>
    <div class="field full"><label>PHOTO</label><input id="fPhoto" type="file" accept="image/*"></div>
  </div>
  <div class="modal-actions"><button type="button" class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn primary">Save</button></div>
</form></div></div>

const SEED={"markup": 0.2, "items": []};
let db=JSON.parse(localStorage.getItem("mailasV2"))||{users:[{u:"admin",p:"admin123"}],inventory:SEED.items,transactions:[],markup:SEED.markup,lastReceipt:null};
let editId=null,pendingPhoto="",currentPage="dashboard";
document.getElementById("loginLogo").src=LOGO;document.getElementById("sideLogo").src=LOGO;
const money=n=>new Intl.NumberFormat("en-PH",{style:"currency",currency:"PHP"}).format(Number(n)||0);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function persist(){localStorage.setItem("mailasV2",JSON.stringify(db))}
function login(){document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden");document.getElementById("who").textContent=sessionStorage.user||"admin";route("dashboard")}
document.getElementById("loginForm").onsubmit=e=>{e.preventDefault();let u=username.value,p=password.value;if(db.users.some(x=>x.u===u&&x.p===p)){sessionStorage.user=u;login()}else alert("Invalid username or password.")};
function logout(){sessionStorage.clear();location.reload()}
function toggleSide(){document.getElementById("sidebar").classList.toggle("open")}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{route(b.dataset.page);document.getElementById("sidebar").classList.remove("open")});
function route(p){currentPage=p;document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===p));pageTitle.textContent={dashboard:"Dashboard",inventory:"Inventory",sales:"Sales / Transactions",receipt:"Printable Receipt"}[p];renderPage()}
function renderPage(){let c=document.getElementById("content");if(currentPage==="dashboard")c.innerHTML=dashboard();if(currentPage==="inventory")c.innerHTML=inventory();if(currentPage==="sales")c.innerHTML=sales();if(currentPage==="receipt")c.innerHTML=receiptPage()}
function dashboard(){
 let total=db.inventory.length,units=db.inventory.reduce((a,x)=>a+Number(x.qty||0),0),low=db.inventory.filter(x=>x.qty>0&&x.qty<=x.reorder).length,out=db.inventory.filter(x=>x.qty<=0).length;
 let sales=db.transactions.reduce((a,t)=>a+t.total,0),today=new Date().toLocaleDateString();
 let todaySales=db.transactions.filter(t=>new Date(t.date).toLocaleDateString()===today).reduce((a,t)=>a+t.total,0);
 return `<div class="stats"><div class="card"><div class="stat-label">Products</div><div class="stat-value">${total}</div></div><div class="card"><div class="stat-label">Units in Stock</div><div class="stat-value">${units}</div></div><div class="card"><div class="stat-label">Low Stock</div><div class="stat-value">${low}</div></div><div class="card"><div class="stat-label">Today's Sales</div><div class="stat-value">${money(todaySales)}</div></div>
 <div class="section grid2"><div class="card"><div class="section-head"><h3>Low-stock alerts</h3><button class="btn secondary" onclick="route('inventory')">View inventory</button></div>${low+out===0?'<div class="empty">All stock levels are above their alert threshold.</div>':`<div class="alert card">${[...db.inventory.filter(x=>x.qty<=x.reorder)].slice(0,8).map(x=>`<div class="summary-row"><span><b>${esc(x.name)}</b><br><small>${x.qty<=0?'Out of stock':'Only '+x.qty+' left'}</small></span><span class="badge ${x.qty<=0?'out':'low'}">${x.qty<=0?'OUT':'LOW'}</span></div>`).join("")}</div>`}</div>
 <div class="card"><div class="section-head"><h3>Sales summary</h3><button class="btn primary" onclick="route('sales')">New sale</button></div><div class="summary-row"><span>Total sales</span><b>${money(sales)}</b></div><div class="summary-row"><span>Transactions</span><b>${db.transactions.length}</b></div><div class="summary-row"><span>20% markup</span><b>${Math.round(db.markup*100)}%</b></div><div class="summary-row total"><span>Inventory value</span><span>${money(db.inventory.reduce((a,x)=>a+x.qty*x.price,0))}</span></div></div></div></div>`
}
function inventory(){
 let q=(document.getElementById("invSearch")?.value||"").toLowerCase();let arr=db.inventory.filter(x=>x.name.toLowerCase().includes(q)||x.sku.toLowerCase().includes(q));
 return `<div class="toolbar"><div class="search"><input id="invSearch" oninput="refreshInventory()" placeholder="Search product or SKU..." value="${esc(q)}"></div><button class="btn primary" onclick="openItem()">＋ Add Product</button></div>
 <div class="section card table-card"><div class="table-wrap"><table><thead><tr><th>SKU</th><th>Item</th><th>SRP</th><th>Markup Price</th><th>Qty</th><th>Status</th><th>Actions</th></tr></thead><tbody>${arr.length?arr.map(x=>`<tr><td>${esc(x.sku)}</td><td><b>${esc(x.name)}</b></td><td class="money">${money(x.price)}</td><td class="money"><b>${money(x.price*(1+db.markup))}</b></td><td>${x.qty}</td><td>${status(x)}</td><td><div class="actions"><button class="icon" onclick="openItem('${x.id}')">Edit</button><button class="icon danger" onclick="delItem('${x.id}')">Delete</button></div></td></tr>`).join(""):'<tr><td colspan="7" class="empty">No products found.</td></tr>'}</tbody></table></div></div>`
}
function refreshInventory(){document.getElementById("content").innerHTML=inventory();document.getElementById("invSearch")?.focus()}
function status(x){return `<span class="badge ${x.qty<=0?'out':x.qty<=x.reorder?'low':'ok'}">${x.qty<=0?'Out of Stock':x.qty<=x.reorder?'Low Stock':'In Stock'}</span>`}
function openItem(id){editId=id||null;pendingPhoto="";let x=id&&db.inventory.find(a=>a.id===id);modalTitle.textContent=x?"Edit Product":"Add Product";itemForm.reset();if(x){fName.value=x.name;fSku.value=x.sku;fPrice.value=x.price;fQty.value=x.qty;fReorder.value=x.reorder}else fReorder.value=5;modal.classList.add("show")}
function closeModal(){modal.classList.remove("show")}
fPhoto.onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>pendingPhoto=r.result;r.readAsDataURL(f)}
itemForm.onsubmit=e=>{e.preventDefault();let x={id:editId||"ITM-"+Date.now(),name:fName.value.trim(),sku:fSku.value.trim(),price:Number(fPrice.value),qty:Number(fQty.value),reorder:Number(fReorder.value)||0,photo:pendingPhoto};if(editId){let i=db.inventory.findIndex(a=>a.id===editId);x.photo=pendingPhoto||db.inventory[i].photo||"";db.inventory[i]=x}else db.inventory.push(x);persist();closeModal();renderPage()}
function delItem(id){let x=db.inventory.find(a=>a.id===id);if(confirm("Delete "+x.name+"?")){db.inventory=db.inventory.filter(a=>a.id!==id);persist();renderPage()}}
function sales(){
 let products=db.inventory.filter(x=>x.qty>0);return `<div class="grid2"><div class="card"><h3 style="margin-top:0">New Sale</h3><div class="field"><label>CUSTOMER NAME</label><input id="cust" placeholder="Walk-in Customer"></div><div id="cart"></div><div class="toolbar" style="margin-top:12px"><button class="btn secondary" onclick="addLine()">＋ Add Product</button><button class="btn primary" onclick="completeSale()">Complete Sale</button></div></div>
 <div class="card"><h3 style="margin-top:0">Recent Transactions</h3>${db.transactions.slice(-8).reverse().map(t=>`<div class="summary-row"><span><b>${esc(t.receipt)}</b><br><small>${esc(t.customer)} • ${new Date(t.date).toLocaleString()}</small></span><b>${money(t.total)}</b></div>`).join("")||'<div class="empty">No transactions yet.</div>'}</div></div><script>window._saleLines=[];addLine();<\/script>`
}
function addLine(){if(!window._saleLines)window._saleLines=[];let id=db.inventory.find(x=>x.qty>0)?.id||"";window._saleLines.push({id,qty:1});drawCart()}
function drawCart(){let el=document.getElementById("cart");if(!el)return;el.innerHTML=window._saleLines.map((l,i)=>{let x=db.inventory.find(a=>a.id===l.id)||db.inventory[0];return `<div class="card" style="padding:12px;margin:8px 0"><div class="field" style="margin:0"><label>PRODUCT</label><select onchange="window._saleLines[${i}].id=this.value;drawCart()">${db.inventory.filter(x=>x.qty>0).map(x=>`<option value="${x.id}" ${x.id===l.id?'selected':''}>${esc(x.name)} — ${money(x.price*(1+db.markup))} (stock ${x.qty})</option>`).join("")}</select></div><div style="display:flex;gap:8px;margin-top:8px"><input type="number" min="1" max="${x?.qty||1}" value="${l.qty}" onchange="window._saleLines[${i}].qty=Number(this.value);drawCart()" style="width:100px;padding:9px;border:1px solid var(--line);border-radius:9px"><button class="btn danger" onclick="window._saleLines.splice(${i},1);drawCart()">Remove</button></div></div>`}).join("")+`<div class="summary-row total"><span>Total</span><span>${money(window._saleLines.reduce((a,l)=>{let x=db.inventory.find(a=>a.id===l.id);return a+(x?x.price*(1+db.markup)*l.qty:0)},0))}</span></div>`}
function completeSale(){if(!window._saleLines?.length)return alert("Add at least one product.");for(let l of window._saleLines){let x=db.inventory.find(a=>a.id===l.id);if(!x||l.qty<1||l.qty>x.qty)return alert("Check product quantities and available stock.")}let items=window._saleLines.map(l=>{let x=db.inventory.find(a=>a.id===l.id);let unit=x.price*(1+db.markup);x.qty-=l.qty;return {id:x.id,name:x.name,qty:l.qty,unit,total:unit*l.qty}});let t={receipt:"R-"+Date.now().toString().slice(-8),date:new Date().toISOString(),customer:(document.getElementById("cust")?.value||"Walk-in Customer"),items,total:items.reduce((a,x)=>a+x.total,0)};db.transactions.push(t);db.lastReceipt=t;persist();window._saleLines=[];alert("Sale completed. Receipt "+t.receipt+" created.");route("receipt")}
function receiptPage(){let t=db.lastReceipt;return `<div class="no-print" style="display:flex;justify-content:flex-end;gap:8px;margin-bottom:12px"><button class="btn secondary" onclick="route('sales')">New Sale</button><button class="btn primary" onclick="window.print()">Print Receipt</button></div>${t?receipt(t):'<div class="card empty">No receipt yet. Complete a sale first.</div>'}`}
function receipt(t){return `<div class="receipt"><h1>Maila's General Merchandise</h1><div class="center">Official Sales Receipt</div><div class="center" style="margin-top:10px">${new Date(t.date).toLocaleString()}<br>Receipt: ${esc(t.receipt)}<br>Customer: ${esc(t.customer)}</div><table><thead><tr><th>ITEM</th><th>QTY</th><th>AMOUNT</th></tr></thead><tbody>${t.items.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.qty}</td><td style="text-align:right">${money(x.total)}</td></tr>`).join("")}</tbody></table><div class="summary-row total"><span>TOTAL</span><span>${money(t.total)}</span></div><div class="center" style="margin-top:22px">Thank you for shopping with us!</div></div>`}
function dateTick(){dateNow.textContent=new Date().toLocaleString("en-PH",{dateStyle:"medium",timeStyle:"short"})}
dateTick();setInterval(dateTick,30000);
if(sessionStorage.user)login();
</script>
</body></html>
